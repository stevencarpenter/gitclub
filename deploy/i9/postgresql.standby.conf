# GitClub disaster recovery standby.
#
# Included from the standby's postgresql.conf. bootstrap-standby.sh installs it
# and appends the include line.
#
# The standby serves nothing. It exists to hold a local, continuously current
# copy of the database and to prove the write-ahead log archive stays
# replayable. Recovery does not promote it directly, because continuous replay
# leaves it ahead of the Git mirror; see deploy/RUNBOOK.md.

# Refuse every connection while recovering. This is the "offline" in the
# design: the machine is a recovery target, not a read replica. Turning this on
# would make it a queryable replica and invite traffic the design excludes.
hot_standby = off

# pgBackRest writes restore_command with the selected stanza and config path.
# Preserve that command rather than replacing it with a hard-coded stanza.
archive_mode = off

# No recovery target: replay follows the archive indefinitely. Recovery sets a
# target explicitly at failover time, taken from the mirror sweep.
recovery_target_timeline = 'latest'

# Local listener only. Nothing outside this host has any reason to reach it.
listen_addresses = 'localhost'
port = 5433

# Preserve the primary's max_connections and other replay-sensitive limits.
# A standby configured below the primary can fail to replay its WAL.
shared_buffers = 512MB
effective_cache_size = 2GB
max_wal_size = 4GB

log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'standby-%Y-%m-%d.log'
log_min_messages = log
log_checkpoints = on
