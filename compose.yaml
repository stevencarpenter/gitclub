services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitclub
      POSTGRES_USER: gitclub
      POSTGRES_PASSWORD: ${GITCLUB_DB_PASSWORD:?Run ./scripts/gitclub up}
    # PostgreSQL 18 images place data in a version subdirectory, so the mount
    # belongs at /var/lib/postgresql, not the pre-18 /var/lib/postgresql/data.
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitclub -d gitclub"]
      interval: 5s
      timeout: 5s
      retries: 10
  go:
    restart: unless-stopped
    build:
      context: .
      dockerfile: implementations/go/Dockerfile
    ports: ["127.0.0.1:7701:7701"]
    environment:
      PUBLIC_URL: http://localhost:7701
      DATABASE_URL: postgres://gitclub:${GITCLUB_DB_PASSWORD:?Run ./scripts/gitclub up}@postgres:5432/gitclub?sslmode=disable
      GITCLUB_SSH_SECRET: ${GITCLUB_SSH_SECRET:?Run ./scripts/gitclub up}
    volumes: ["go-data:/data"]
    init: true
    stop_grace_period: 20s
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7701/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  go-ssh:
    restart: unless-stopped
    build:
      context: .
      dockerfile: shared/Dockerfile.ssh
    ports: ["127.0.0.1:2221:2222"]
    environment:
      GITCLUB_URL: http://go:7701
      GITCLUB_SSH_SECRET: ${GITCLUB_SSH_SECRET:?Run ./scripts/gitclub up}
    volumes: ["go-data:/data"]
    depends_on:
      go: {condition: service_healthy}
volumes:
  go-data:
  postgres-data:
